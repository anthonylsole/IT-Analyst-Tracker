name = "it-analyst-tracker"
main = "worker/src/index.js"
compatibility_date = "2024-09-23"

[assets]
directory = "./dist"
binding = "ASSETS"
# Without this, Cloudflare serves any matching static file (like index.html)
# directly and never runs the Worker script below — which is exactly why
# the redirect appeared to do nothing. Setting this to true forces every
# request, with no exceptions, to go through fetch() in worker/src/index.js.
run_worker_first = true
